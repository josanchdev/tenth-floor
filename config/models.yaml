# LLM model assignments for each agent.
#
# Phase 1.5: AI-first architecture
#   MacroAnalyst  — macro regime assessment (runs once)
#   TradeAnalyst  — per-asset trade analysis (runs per candidate)
#   RiskReviewer  — portfolio-level review (runs once, sees all proposals)
#
# Provider routing: change 'defaults.provider' and 'defaults.base_url'
# to switch all agents at once, or override per agent for mixed deployments.
#
# Supported providers:
#   openai — any OpenAI-compatible API (vLLM, Ollama, llama.cpp, OpenAI)
#
# The LLM_BASE_URL env var overrides defaults.base_url if set.

defaults:
  provider: openai
  base_url: http://localhost:8000/v1    # vLLM server
  model: Qwen/Qwen3-32B-AWQ
  timeout: 30.0                          # seconds; covers slow vLLM cold-starts
  max_retries: 3                         # retries on transient failures (502, timeout, etc.)

macro_analyst:
  temperature: 0.2          # Slightly creative for regime narrative
  max_output_tokens: 1024   # Per-class impact + regime reasoning

trade_analyst:
  temperature: 0.10         # Low temp → consistent analysis
  max_output_tokens: 2048   # Full trade thesis with level reasoning (~800 tokens typical)

risk_reviewer:
  temperature: 0.10         # Low temp → consistent portfolio decisions
  max_output_tokens: 2048   # ~50 tokens per verdict × up to 30 proposals = ~1500
  timeout: 60.0             # Longer timeout — larger prompt with all proposals
