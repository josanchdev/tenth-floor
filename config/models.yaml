# LLM model assignments for each agent.
#
# Provider routing: change 'defaults.provider' and 'defaults.base_url'
# to switch all agents at once, or override per agent for mixed deployments.
#
# Supported providers:
#   openai — any OpenAI-compatible API (vLLM, Ollama, llama.cpp, OpenAI)
#
# The LLM_BASE_URL env var overrides defaults.base_url if set.

defaults:
  provider: openai
  base_url: http://localhost:8000/v1    # vLLM server
  model: Qwen/Qwen3.5-27B
  timeout: 30.0                          # seconds; covers slow vLLM cold-starts
  max_retries: 3                         # retries on transient failures (502, timeout, etc.)

quant_agent:
  temperature: 0.1          # Low temp → deterministic regime classification
  max_output_tokens: 512    # Output is ~150 tokens of JSON; keep low to fit 4096 context

sentiment_agent:
  temperature: 0.3          # Slightly higher → richer narrative
  max_output_tokens: 512

strategy_agent:
  temperature: 0.1          # Low temp → consistent structured JSON output
  max_output_tokens: 512    # Output is ~200 tokens of JSON; keep low to fit 4096 context

risk_agent:
  temperature: 0.0          # Zero temp → strict rule application
  max_output_tokens: 512

tweet_drafter:
  temperature: 0.7          # Higher temp → creative, varied tweets
  max_output_tokens: 1024   # Hook + thread replies + reasoning need more room
