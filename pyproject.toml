[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-tenth-floor"
version = "0.1.0"
description = "The Tenth Floor — personal multi-asset swing-trade research pipeline"
authors = [{name = "Jorge Sánchez Aguilar", email = "jsanagui@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "ccxt>=4.3.0",                    # Binance data (read-only)
    "pandas>=2.1.0",                  # Dataframes
    "pandas-ta>=0.3.14b0",            # Technical indicators (b0 = valid PEP 440)
    "pydantic>=2.5.0",                # Typed models / JSON schemas
    "langfuse>=2.0.0",                # LLM observability & tracing
    "openai>=1.0.0",                  # OpenAI-compatible API (vLLM, Ollama, OpenAI)
    "feedparser>=6.0.10",             # RSS parsing (sentiment headlines)
    "pyarrow>=15.0.0",                # Parquet I/O
    "python-dotenv>=1.0.0",           # .env loading
    "pyyaml>=6.0.1",                  # YAML config loading
    "yfinance>=0.2.36",               # Equity/ETF/commodity OHLCV (Yahoo Finance)
    "fastapi>=0.115.0",               # Dashboard backend API
    "uvicorn[standard]>=0.32.0",      # ASGI server + WebSocket support
    "httpx>=0.27.0",                  # Async HTTP client (FastAPI tests + llm_manager readiness probe)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
]

[project.urls]
Repository = "https://github.com/josanchdev/tenth-floor"

[project.scripts]
run-daily = "tenth_floor.main:main"

# Tell hatchling that the Python package lives under src/
[tool.hatch.build.targets.wheel]
packages = ["src/tenth_floor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # pycodestyle, pyflakes, isort, pyupgrade, bugbear
ignore = ["E501", "UP047"]              # line-length handled by formatter; UP047 = PEP 695 type params (not yet widespread)

[tool.mypy]
# Without this plugin mypy treats every pydantic Field(None, ...) default as a
# required argument, which produced ~18 phantom "missing named argument" errors.
plugins = ["pydantic.mypy"]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

# Third-party packages that ship no type information. Listing them explicitly
# (rather than setting a global ignore_missing_imports) keeps the check strict
# for everything else, so a genuinely missing first-party import still fails.
[[tool.mypy.overrides]]
module = [
    "ccxt.*",
    "feedparser.*",
    "langfuse.*",
    "pandas.*",
    "pandas_ta.*",
    "pyarrow.*",
    "yaml.*",
    "yfinance.*",
]
ignore_missing_imports = true
