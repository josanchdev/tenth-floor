[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-tenth-floor"
version = "0.1.0"
description = "The Tenth Floor AI — multi-asset swing-trade analysis pipeline"
authors = [{name = "Josanchdev", email = "jsanagui@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "ccxt>=4.3.0",                    # Binance data (read-only)
    "pandas>=2.1.0",                  # Dataframes
    "pandas-ta>=0.3.14b0",            # Technical indicators (b0 = valid PEP 440)
    "pydantic>=2.5.0",                # Typed models / JSON schemas
    "langfuse>=2.0.0",                # LLM observability & tracing
    "openai>=1.0.0",                  # OpenAI-compatible API (vLLM, Ollama, OpenAI)
    "feedparser>=6.0.10",             # RSS parsing
    "pyarrow>=15.0.0",                # Parquet I/O
    "requests>=2.31.0",               # Discord webhook HTTP calls
    "typer>=0.12.0",                  # CLI
    "rich>=13.7.0",                   # Pretty console output
    "python-dotenv>=1.0.0",           # .env loading
    "pyyaml>=6.0.1",  # YAML config loading
    "streamlit>=1.35.0",  # Admin dashboard
    "tweepy>=4.14.0",  # X/Twitter API for auto-poster
    "yfinance>=0.2.36",               # Equity/ETF/commodity OHLCV (Yahoo Finance)
    "exchange_calendars>=4.5.0",      # Market calendars (trading days, holidays)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
]

[project.scripts]
run-daily = "tenth_floor.main:main"

# Tell hatchling that the Python package lives under src/
[tool.hatch.build.targets.wheel]
packages = ["src/tenth_floor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # pycodestyle, pyflakes, isort, pyupgrade, bugbear
ignore = ["E501", "UP047"]              # line-length handled by formatter; UP047 = PEP 695 type params (not yet widespread)

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
