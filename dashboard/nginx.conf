server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # FastAPI REST routes — keep prefix, api service mounts at root.
    location /api/ {
        proxy_pass http://api:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # WebSocket upgrade for the pipeline event stream.
    location /ws {
        proxy_pass http://api:8765/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # SPA fallback — any unknown route resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
